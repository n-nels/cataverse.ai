  # subifg: the skip detector (spectral_fitting.peak_analysis) -- a spectrum
  # with no peak in raw - baseline is not fitted, area 0. fsd: FSD peak finding
  # (find_fsd_peaks; its snapping never matches, docs/spec-live-migration.md O1).
