# -------------------
# ir_fitting (offline refit)
# -------------------
# Read by src/utils/ir_fitting only; the live server never sees this block.
# `fit` uses the same keys as voigt_fit so the vendored fit
# (src/utils/ir_fitting/voigt.py) reads it unchanged and promoting to live is a
# copy of values. It is a COPY, not a reference: editing voigt_fit does not
# change offline fits, and editing this does not change live output.
# See src/utils/ir_fitting/spec-working.md.
#
# Units: peak lists are 12CO base (shifted -50 at read for 13CO) and must be
# integers -- Peak_Name is Peak_<value> (12CO 2175 == 13CO Peak_2125).
# param_rules are 13CO (param_rules_base_isotope).
