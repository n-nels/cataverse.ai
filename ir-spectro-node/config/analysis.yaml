  # Anchored two-segment baseline (src/analysis/baseline.py): the offline
  # BaselineVariant() defaults (src/utils/ir_fitting/baseline.py). Anchor order
  # and duplicates are kept -- a repeated anchor is a weight (1955 x3).
  baseline_recipe:
    anchors_cm1: [2240, 2006, 1955, 1955, 1955]
    lower_split_cm1: 1955         # below it a second baseline replaces the first
    lower_anchors_cm1: [1955, 1800, 1820]
    anchor_guard_cm1: 25.0        # drop an anchor (or the cut) with a dominant extremum this close
    anchor_prominence_frac: 0.5   # dominant = prominence >= this x the whole-ROI range

# Live nucleation detector (src/analysis/classification.py). Values copied from
# kinetics_reprocess_classification on 2026-10-09; the offline block below is
# the reprocessing copy. Design and scoring: docs/JOURNAL_nuc-clf-refit.md.
kinetics_classification:
  peak_name: Peak_1988          # 13CO Peak_Name of the swept peak
  window_s: 28800.0             # rise is measured above the min of the last 8 h
  smooth_n: 3                   # causal per-Delta_Group median of this many points
  rise_threshold: 0.00275       # au; median-over-groups windowed rise must exceed this
  amplitude_min: 0.006          # au; median-over-groups prefix peak-to-trough
  zero_floor: false             # amplitude trough is max(0, min) when true
  required_consecutive: 3       # latch after this many consecutive fires
  growth_onset_amplitude_min: 0.010  # au; growth_onset_s gate on the pooled, unsmoothed prefix

# Live segment-wise kinetics (src/analysis/segments.py). Values copied from
# kinetics_reprocess_segments on 2026-10-09.
kinetics_segments:
  smooth_n: 5                   # points; centered running median of the pooled sum trajectory
  spike_window_before_s: 7200.0 # cluster_sum max is searched from monomer max - 2 h ...
  spike_window_after_s: 28800.0 # ... to monomer max + 8 h
  spike_plateau_gap_s: 14400.0  # plateau = median smoothed cluster_sum from 4 h after the max
  spike_min_plateau_points: 3
  spike_min_prominence: 5.0     # (max - plateau) / noise; noise = 1.4826 * MAD(raw - smoothed)
  spike_min_rise: 5.0           # (max - smoothed value at the spike base) / noise

# Offline nucleation detector (src/utils/kinetics/classification.py) for the
# 24-peak refit areas. Read by src/utils/kinetics only; live reads
# kinetics_classification above. Design and scoring: docs/JOURNAL_nuc-clf-refit.md.
kinetics_reprocess_classification:
  peak_name: Peak_1988          # 13CO Peak_Name of the swept peak
  window_s: 28800.0             # rise is measured above the min of the last 8 h
  smooth_n: 3                   # causal per-Delta_Group median of this many points
  rise_threshold: 0.00275       # au; median-over-groups windowed rise must exceed this
  amplitude_min: 0.006          # au; median-over-groups prefix peak-to-trough
  zero_floor: false             # amplitude trough is max(0, min) when true
  required_consecutive: 3       # latch after this many consecutive fires
  growth_onset_amplitude_min: 0.010  # au; growth_onset_s gate on the pooled, unsmoothed prefix

# Offline segment-wise kinetics (src/utils/kinetics/segments.py, fit_cli
# --mode segments). Boundaries come from the pooled sum trajectories, smoothed
# by a centered running median. Design: src/utils/kinetics/spec-working.md.
kinetics_reprocess_segments:
  smooth_n: 5                   # points; centered running median of the pooled sum trajectory
  spike_window_before_s: 7200.0 # cluster_sum max is searched from monomer max - 2 h ...
  spike_window_after_s: 28800.0 # ... to monomer max + 8 h
  spike_plateau_gap_s: 14400.0  # plateau = median smoothed cluster_sum from 4 h after the max
  spike_min_plateau_points: 3
  spike_min_prominence: 5.0     # (max - plateau) / noise; noise = 1.4826 * MAD(raw - smoothed)
  spike_min_rise: 5.0           # (max - smoothed value at the spike base) / noise

