experiment_id: lightgbm_v1_0001
description: "Turn 1 — broad random search over 13 LightGBM hyperparameters. Goal: discover which knobs correlate with improvement."
model_name: lightgbm
baseline_experiment: lgbm_baseline
split_seed: 42
primary_metric: validation_avg_rmse
search_method: random
allowed_hyperparameters:
  - name: n_estimators
    type: numeric
    range: [200, 3000]
  - name: learning_rate
    type: numeric
    range: [0.01, 0.3]
  - name: max_depth
    type: numeric
    range: [3, 15]
  - name: num_leaves
    type: numeric
    range: [15, 255]
  - name: min_child_samples
    type: numeric
    range: [5, 100]
  - name: subsample
    type: numeric
    range: [0.5, 1.0]
  - name: colsample_bytree
    type: numeric
    range: [0.5, 1.0]
  - name: reg_alpha
    type: numeric
    range: [0.0, 10.0]
  - name: reg_lambda
    type: numeric
    range: [0.0, 10.0]
  - name: early_stopping_rounds
    type: numeric
    range: [10, 150]
  - name: random_state
    type: numeric
    range: [1, 500]
  - name: strategy
    type: categorical
    choices: [shared, separate]
  - name: boosting_type
    type: categorical
    choices: [gbdt, dart, goss]
maximum_trial_count: 30
maximum_wall_clock_minutes: 120
maximum_test_finalists: 3
minimum_improvement_threshold: 0.005
per_trial_timeout_minutes: 10
artifact_output_location: artifacts/experiments
