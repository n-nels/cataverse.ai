experiment_id: rf_v2_0001
description: "Turn 2 — refine: separate-only (proven winner), deeper trees (max_depth hit upper bound), low colsample (winners at ~0.38-0.41), low min_leaf (winners at 2-7). Hypothesis: deeper trees + low colsample generalize better."
model_name: random_forest
baseline_experiment: rf_baseline
split_seed: 42
primary_metric: validation_avg_rmse
search_method: random
allowed_hyperparameters:
  - name: n_estimators
    type: numeric
    range: [500, 2000]
  - name: max_depth
    type: numeric
    range: [20, 50]
  - name: min_child_samples
    type: numeric
    range: [1, 15]
  - name: subsample
    type: numeric
    range: [0.7, 1.0]
  - name: colsample_bytree
    type: numeric
    range: [0.3, 0.5]
  - name: random_state
    type: numeric
    range: [1, 500]
  - name: strategy
    type: categorical
    choices: [separate]
maximum_trial_count: 30
maximum_wall_clock_minutes: 120
maximum_test_finalists: 3
minimum_improvement_threshold: 0.005
per_trial_timeout_minutes: 10
artifact_output_location: artifacts/experiments
