# LightGBM v2 — expanded hyperparameter search.
# Includes num_leaves, subsample, colsample_bytree, regularization, and model seed.

experiment_id: lgbm_v2_0001
description: "Random search over expanded LightGBM hyperparameters (30 trials)."
model_name: lightgbm
baseline_experiment: lgbm_baseline
split_seed: 42
primary_metric: validation_avg_rmse
search_method: random
allowed_hyperparameters:
  - name: n_estimators
    type: numeric
    range: [100, 2000]
  - name: learning_rate
    type: numeric
    range: [0.01, 0.3]
  - name: max_depth
    type: numeric
    range: [3, 12]
  - name: num_leaves
    type: numeric
    range: [15, 255]
  - name: min_child_samples
    type: numeric
    range: [5, 100]
  - name: subsample
    type: numeric
    range: [0.5, 1.0]
  - name: colsample_bytree
    type: numeric
    range: [0.3, 1.0]
  - name: reg_alpha
    type: numeric
    range: [0.0, 1.0]
  - name: reg_lambda
    type: numeric
    range: [0.0, 1.0]
  - name: early_stopping_rounds
    type: numeric
    range: [20, 100]
  - name: random_state
    type: numeric
    range: [1, 9999]
  - name: strategy
    type: categorical
    choices: [shared, separate]
maximum_trial_count: 30
maximum_wall_clock_minutes: 120
maximum_test_finalists: 3
minimum_improvement_threshold: 0.005
per_trial_timeout_minutes: 10
artifact_output_location: artifacts/experiments
