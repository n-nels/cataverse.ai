[project]
name = "cataverse-agent"
version = "0.1.0"
description = "Terminal agent that answers questions about the cataverse Neo4j graph using a local LLM via Ollama"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "neo4j>=5.0",
    "python-dotenv",
    "rich",
]

[project.scripts]
cataverse-agent = "cataverse_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.hatch.build.targets.wheel]
packages = ["src/cataverse_agent"]
