- name: clean_surface
  signature: "clean_surface(evac_temp, evac_time, ramp_rate, enable_ms, chiller)"
  parameters:
    - {name: evac_temp, type: float, unit: "°C",
       desc: "Target temperature during evacuation"}
    - {name: evac_time, type: float, unit: "hours",
       desc: "Hold time at target under turbo pump"}
    - {name: ramp_rate, type: float, unit: "°C/min",
       desc: "Heating ramp rate; 0 = no ramp",
       default: 20}
    - {name: enable_ms, type: bool, unit: null,
       desc: "Stream mass-spec data during cleaning",
       default: false}
    - {name: chiller,   type: bool, unit: null,
       desc: "Enable chiller during all pretreatment steps",
       default: false}
  docstring: "Evacuate and heat to clean the catalyst surface."

- name: oxidize_surface
  signature: "oxidize_surface(pressure, temp, time, evac_temp, evac_time)"
  parameters:
    - {name: pressure,  type: float, unit: Torr,
       desc: "O2 target pressure in the total volume"}
    - {name: temp,      type: float, unit: "°C",
       desc: "Temperature during oxidation"}
    - {name: time,      type: float, unit: "hours",
       desc: "Hold time under O2"}
    - {name: evac_temp, type: float, unit: "°C",
       desc: "Temperature during post-oxidation evacuation"}
    - {name: evac_time, type: float, unit: "hours",
       desc: "Hold time under turbo pump after oxidation"}
  docstring: "Dose O2 to oxidize the surface, hold at temperature, then evacuate."

- name: pretreat_adsorbate
  signature: "pretreat_adsorbate(adsorbate, pressure, temp, time, evac_temp, evac_time)"
  parameters:
    - {name: adsorbate, type: "str | list[str]", unit: null,
       desc: "Gas species to dose; single or two-element list for co-adsorption"}
    - {name: pressure,  type: "float | list[float]", unit: Torr,
       desc: "Target pressure(s) in the total volume, matching adsorbate"}
    - {name: temp,      type: float, unit: "°C",
       desc: "Temperature during pretreatment"}
    - {name: time,      type: float, unit: "hours",
       desc: "Hold time under gas"}
    - {name: evac_temp, type: float, unit: "°C",
       desc: "Temperature during post-pretreatment evacuation"}
    - {name: evac_time, type: float, unit: "hours",
       desc: "Hold time under turbo pump after pretreatment"}
  docstring: "Dose a pretreatment gas (or two co-adsorbates), hold at temperature, then evacuate."

- name: monitor_adsorption
  signature: "monitor_adsorption(adsorbate, pressure, temp, repeat, delay, all_fileids, do_bckg, do_fit)"
  parameters:
    - {name: adsorbate,    type: "str | list[str]", unit: null,
       desc: "Gas species to adsorb; single or two-element list for co-adsorption"}
    - {name: pressure,     type: "float | list[float]", unit: Torr,
       desc: "Target pressure(s) in the total volume, matching adsorbate"}
    - {name: temp,         type: float, unit: "°C",
       desc: "Adsorption temperature"}
    - {name: repeat,       type: "list[int]", unit: null,
       desc: "Repeat counts for spectral acquisition groups"}
    - {name: delay,        type: "list[int] | null", unit: "s",
       desc: "Delay times between acquisition groups",
       default: null}
    - {name: all_fileids,  type: bool, unit: null,
       desc: "Reset OPUS file IDs at start",
       default: true}
    - {name: do_bckg,      type: bool, unit: null,
       desc: "Acquire background spectrum first",
       default: true}
    - {name: do_fit,       type: bool, unit: null,
       desc: "Run peak fitting after acquisition",
       default: true}
  docstring: "Cool, dose adsorbate(s), and acquire spectra while monitoring pressure."

- name: finalize
  signature: "finalize(success)"
  parameters:
    - {name: success, type: bool, unit: null,
       desc: "Whether the experiment completed successfully"}
  docstring: "End-of-experiment cleanup: mark success, copy files, notify OPUS."
