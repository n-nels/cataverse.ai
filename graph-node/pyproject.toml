[project]
name = "cataverse-graph"
version = "0.1.0"
description = "Builds and loads the cataverse Neo4j graph from experiment output"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.0",
    "pandas",
    "pyyaml",
    "python-dotenv",
    # Verify TLS against the OS trust store, so a machine behind a TLS-
    # inspecting firewall can still reach Aura. See common/tls.py.
    "truststore>=0.9",
]

[project.scripts]
graph-node = "graph_node.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_node"]
