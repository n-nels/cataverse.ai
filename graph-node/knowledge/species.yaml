# ChemSpecies seed (§9 of knowledge_graph_instructions.txt).
# Loaded into :ChemSpecies nodes; uniqueness key is `formula`.
# 12CO included for forward compatibility (co-adsorption with 13CO mentioned
# in adsorption.py [4]); may not appear in the initial six folders.

- formula: O2
  role: ["oxidizer"]

- formula: H2
  role: ["reductant"]

- formula: CO
  role: ["probe"]

- formula: 13CO
  role: ["probe", "isotopologue"]

- formula: 12CO
  role: ["probe", "isotopologue"]

- formula: H2O
  role: ["hydroxylation"]

- formula: D2O
  role: ["deuteroxylation", "isotopologue"]

- formula: CO2
  role: ["carbonation", "oxidizer"]
