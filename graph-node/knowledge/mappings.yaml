# Cross-cutting mappings (§12 of knowledge_graph_instructions.txt).
# Drives :IMPLEMENTS, :USES_SPECIES, and :INSTANCE_OF edge generation.

# PyFunction -> ChemConcept (:IMPLEMENTS edges)
# Note on gas_dosing_cell: only attached when no specific subtype is known
# at author time. monitor_adsorption omits it because adsorption_measurement
# already :SUBTYPE_OF gas_dosing_cell makes it recoverable by traversal.
py_to_concept:
  clean_surface:        [evacuation, thermal_ramp, thermal_soak]
  oxidize_surface:      [oxidation, thermal_soak, evacuation]
  pretreat_adsorbate:   [gas_dosing_cell, thermal_soak, evacuation]
  monitor_adsorption:   [cooling, acquire_spectra, adsorption_measurement]
  finalize:             []

# ChemConcept -> ChemSpecies (:USES_SPECIES edges)
concept_to_species:
  oxidation:                       [O2, CO2]
  reduction:                       [H2]
  hydroxylation:                   [H2O]
  deuteroxylation:                 [D2O]
  carbonation:                     [CO2]
  adsorption_measurement:          [CO, 13CO, 12CO]
  isotopic_exchange_measurement:   [CO, 13CO, 12CO]

# :INSTANCE_OF rules (knowledge -> data)
instance_of_rules:

  # Used by R2 (chemistry rule on :Pretreatment). One entry per chemistry-active
  # gas species. CO/13CO/12CO are deliberately omitted; their concept depends
  # on Filename.exp_type and is handled by the ExpConditions rules below.
  species_to_chemistry:
    O2:   [oxidation]
    H2:   [reduction]
    H2O:  [hydroxylation]
    D2O:  [deuteroxylation]
    CO2:  [oxidation, carbonation]

  # Pretreatment rules. All matches applied; no short-circuiting.
  pretreatment_rules:
    - id: R1_evacuation
      when: "gas in ['RoughPump','TurboPump']"
      concepts: [evacuation]
    - id: R2_chemistry
      when: "gas matches species_to_chemistry"
      concepts: [<looked_up_from_species_to_chemistry>]
    - id: R3_ramp
      when: "rate > 0"
      concepts: [thermal_ramp]
    - id: R4_soak
      when: "rate == 0 and duration > 0"
      concepts: [thermal_soak]

  expconditions_rules:
    - id: E1_adsorption
      when: "gas in ['CO','13CO','12CO'] and exp_type == 'adsorption'"
      concepts: [adsorption_measurement]
    - id: E2_isotopic
      when: "gas in ['CO','13CO','12CO'] and exp_type == 'isotopic_exchange'"
      concepts: [isotopic_exchange_measurement]

  filename_rules:
    - id: F1_reference
      when: "is_reference == true"
      concepts: [reference_state]

  adsparams_rules:
    - id: A1_reference
      when: "parent_filename.is_reference == true"
      concepts: [reference_state]
    - id: A2_fit_by
      when: "always"
      fit_by: pfo_secondary
