# ChemConcept seed for the knowledge graph (§6 of knowledge_graph_instructions.txt).
# Loaded by scripts/load_knowledge.py into :ChemConcept nodes plus :SUBTYPE_OF edges.
# subtype_of: null means the concept is a top-level category (no parent).

# ---- Operational concepts (kind="operational") -----------------------------

- name: evacuation
  kind: operational
  definition: "Pumping the cell with rough or turbo pump; physically removes
               gas-phase species and drives surface desorption."
  aliases: ["desorption"]
  subtype_of: null

- name: gas_dosing_cell
  kind: operational
  definition: "Exposing the sample in the cell to a gas. Parent concept for
               every chemistry subtype; attached directly to a data node only
               when no specific chemistry subtype is known at author time."
  aliases: []
  subtype_of: null

- name: thermal_ramp
  kind: operational
  definition: "Changing cell temperature at a non-zero rate."
  aliases: []
  subtype_of: null

- name: thermal_soak
  kind: operational
  definition: "Holding cell temperature constant for a non-zero duration
               (rate == 0, duration > 0)."
  aliases: []
  subtype_of: null

- name: cooling
  kind: operational
  definition: "Lowering cell temperature toward the adsorption setpoint."
  aliases: []
  subtype_of: null

- name: acquire_spectra
  kind: operational
  definition: "Acquiring IR spectra during a step. Implied by every
               :ExpConditions node by definition."
  aliases: []
  subtype_of: null

# ---- Chemistry concepts (kind="chemistry"); each :SUBTYPE_OF gas_dosing_cell

- name: oxidation
  kind: chemistry
  definition: "Exposure of catalyst to O2 (or CO2) with intent to oxidize."
  aliases: ["calcination"]
  subtype_of: gas_dosing_cell

- name: reduction
  kind: chemistry
  definition: "Exposure of catalyst to H2 with intent to reduce the surface."
  aliases: []
  subtype_of: gas_dosing_cell

- name: hydroxylation
  kind: chemistry
  definition: "Exposure of catalyst to H2O with intent to hydroxylate the surface."
  aliases: []
  subtype_of: gas_dosing_cell

- name: deuteroxylation
  kind: chemistry
  definition: "Exposure of catalyst to D2O; isotopologue analogue of hydroxylation."
  aliases: []
  subtype_of: gas_dosing_cell

- name: carbonation
  kind: chemistry
  definition: "Exposure of catalyst to CO2 with intent to form surface carbonates."
  aliases: []
  subtype_of: gas_dosing_cell

- name: adsorption_measurement
  kind: chemistry
  definition: "ExpConditions step where a CO isotopologue is dosed and IR
               spectra are acquired to measure adsorption kinetics
               (Filename.exp_type == 'adsorption')."
  aliases: []
  subtype_of: gas_dosing_cell

- name: isotopic_exchange_measurement
  kind: chemistry
  definition: "ExpConditions step probing isotopic exchange
               (Filename.exp_type == 'isotopic_exchange'). Out of scope for
               the v1 data graph but represented here for completeness."
  aliases: []
  subtype_of: gas_dosing_cell

# ---- State concepts (kind="state") -----------------------------------------

- name: metastable_state
  kind: state
  definition: "A kinetically trapped configuration of the sample along the
               kinetic trajectory. Parent of all per-experiment states."
  aliases: []
  subtype_of: null

- name: reference_state
  kind: state
  definition: "A metastable state reached by a notionally identical reference
               script execution. Attached to :Filename and :AdsParams nodes
               where is_reference == true."
  aliases: []
  subtype_of: metastable_state
